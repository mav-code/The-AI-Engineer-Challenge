[project]
name = "beyond-chatgpt"
version = "0.1.0"
description = "gpt-like-a-dev"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.12",
    "anthropic",
    "openai",          # query + corpus embeddings (and optional chat provider)
    # "voyageai",      # alternative embedding provider
    "numpy",
    "pydantic>=2.11.4",
    "uvicorn>=0.34.2",
    "python-dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx",  # fastapi.testclient transport
]
