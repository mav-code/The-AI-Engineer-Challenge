<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Analyst">
  <!-- Original mark, not the Twemoji 🧐 face: at 16px a full emoji face turns to
       mush, and vendoring Twemoji would drag in its CC-BY attribution. A bare
       monocle reads at tab size and still says "the Analyst is looking at you".
       Colours are palette steps 1 (#D45F2A) and 2 (#EDA551) — adjacent, so the
       ±1 rule in CLAUDE.md holds here too. Black strokes match the UI's borders. -->
  <rect width="64" height="64" rx="14" fill="#D45F2A"/>
  <!-- Chain, drawn first so the lens sits on top of where it joins. -->
  <path d="M32 46 L32 53 Q32 57 36 57 L45 57" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lens. -->
  <circle cx="32" cy="27" r="16" fill="#EDA551" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Glint: one short highlight arc, kept thick so it survives downscaling. -->
  <path d="M24 21 Q26.5 17 31 16" fill="none" stroke="#F8F0E4" stroke-width="3.5" stroke-linecap="round"/>
</svg>
